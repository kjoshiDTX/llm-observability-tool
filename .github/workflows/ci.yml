name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -count=1 ./...

  python:
    name: Python client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e client/
          pip install pytest
      - name: pytest
        run: python -m pytest client/tests -v

  docker:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config
      - name: Build collector image
        run: docker build -f deploy/Dockerfile -t llm-obs-collector:ci .
